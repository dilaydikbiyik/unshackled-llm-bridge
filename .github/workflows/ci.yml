name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Includes the architecture boundary rules and the setHtml-only rule.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Fails the build if coverage drops below the thresholds in vitest.config.ts.
      - name: Test with coverage
        run: npm run coverage

      - name: Build
        run: npm run build

      - name: Upload built extension
        uses: actions/upload-artifact@v7
        with:
          name: unshackled-llm-bridge-dist
          path: dist/
          retention-days: 14

  e2e:
    name: End-to-end (extension in Chromium)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Builds dist/, loads it into Chromium, and drives full forks against
      # local fixture pages — no login, no network.
      - name: Run end-to-end suite
        run: npm run e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
