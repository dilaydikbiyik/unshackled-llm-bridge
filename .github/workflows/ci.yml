name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Includes the architecture boundary rules — a layer violation fails here.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Fails the build if coverage drops below the thresholds in vitest.config.ts.
      - name: Test with coverage
        run: npm run coverage

      - name: Build
        run: npm run build

      - name: Upload built extension
        uses: actions/upload-artifact@v4
        with:
          name: unshackled-llm-bridge-dist
          path: dist/
          retention-days: 14
