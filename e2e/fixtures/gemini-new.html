<!doctype html>
<!-- Mirrors a gemini.google.com new-chat page (config v5). -->
<html lang="en">
  <head><meta charset="utf-8" /><title>Gemini (fixture)</title></head>
  <body>
    <a href="/app">New chat</a>
    <main>
      <rich-textarea>
        <div class="ql-editor" contenteditable="true"></div>
      </rich-textarea>
    </main>
    <script>
      // Records what the extension drops, so the suite can prove the context
      // file actually arrives rather than only that the composer changed.
      window.__droppedFiles = [];
      document.addEventListener('drop', (event) => {
        for (const file of event.dataTransfer?.files ?? []) {
          file.text().then((text) => window.__droppedFiles.push({ name: file.name, text }));
          // Platforms show an uploaded file by name; the extension looks for
          // exactly that to tell a real upload from a drop that went nowhere.
          const chip = document.createElement('div');
          chip.className = 'attachment-chip';
          chip.textContent = file.name;
          document.body.append(chip);
        }
      }, true);
    </script>
  </body>
</html>
