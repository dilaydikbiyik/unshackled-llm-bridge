<!doctype html>
<!-- Mirrors chatgpt.com action bars as verified live on 2026-11-20 (config v10):
     a prompt's bar is inside its turn; a reply's bar sits beside the reply in
     the block that holds it, ending in "Diğer işlemler" (⋯). -->
<html lang="tr">
  <head><meta charset="utf-8" /><title>ChatGPT actions (fixture)</title></head>
  <body>
    <main>
      <!-- As live: prompt and reply in one stack; the reply's bar beside the stack. -->
      <div class="group flex flex-col">
        <div class="stack">
          <div data-content-search-unit-key="fallback-turn-0:0:user">
            <div data-user-message-bubble="true"><div class="whitespace-pre-wrap">Kyoto gezisi planla</div></div>
            <div class="turn-action-controls"><button class="site-btn" aria-label="Mesajı kopyala"><svg width="16" height="16"></svg></button><button class="site-btn" aria-label="Mesajı düzenle"><svg width="16" height="16"></svg></button></div>
          </div>
          <div class="block"><div data-content-search-unit-key="fallback-turn-0:1:assistant">
            <div class="DilResponseRoot-HfQrEh"><p>Nisan başında <strong>kiraz çiçekleri</strong> için git.</p></div>
          </div></div>
        </div>
        <div class="turn-action-controls"><div class="bar"><button class="site-btn" aria-label="Kopyala"><svg width="16" height="16"></svg></button><span class="wrap"><button class="site-btn" aria-label="Diğer işlemler" aria-haspopup="menu"><svg width="16" height="16"></svg></button></span></div></div>
      </div>
      <form data-chatgpt-composer><div data-composer-markdown contenteditable="true" class="ProseMirror"></div></form>
    </main>
  </body>
</html>
