<!doctype html>
<!-- Mirrors a claude.ai new-chat page (config v5). The send button counts
     clicks so the suite can prove the extension never sends. -->
<html lang="en">
  <head><meta charset="utf-8" /><title>Claude (fixture)</title></head>
  <body>
    <a href="/new">New chat</a>
    <main>
      <fieldset>
        <div contenteditable="true" class="ProseMirror"></div>
        <button aria-label="Send message" onclick="window.__sendClicks = (window.__sendClicks || 0) + 1">
          Send
        </button>
      </fieldset>
    </main>
    <script>
      // Records what the extension drops, so the suite can prove the context
      // file actually arrives rather than only that the composer changed.
      window.__droppedFiles = [];
      document.addEventListener('drop', (event) => {
        for (const file of event.dataTransfer?.files ?? []) {
          file.text().then((text) => window.__droppedFiles.push({ name: file.name, text }));
        }
      }, true);
    </script>
  </body>
</html>
